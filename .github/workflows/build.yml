name: Build standalone executables

# Runs the same three-platform build this project has already validated by
# hand: Linux via the existing Docker image (packaging/linux/Dockerfile,
# reused as-is rather than reimplemented as native runner steps — it already
# encodes the Ubuntu 24.04 / glibc-2.39 floor and the PyInstaller symlink-bug fix), macOS
# and Windows as native PyInstaller builds on GitHub-hosted runners.
#
# Version pins for pypylon/pyinstaller/pyinstaller-hooks-contrib are kept in
# sync by hand with packaging/linux/Dockerfile's ARG defaults — bump both
# together, deliberately, same as the Dockerfile's own comment says.
#
# Linux builds on every push/PR (cheap, standard-rate runner). macOS/Windows
# only build on a tag push or manual dispatch — this repo is private, and
# GitHub bills macOS minutes at 10x / Windows at 2x, so routine pushes don't
# pay for that.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  PYPYLON_VERSION: "26.7"
  PYINSTALLER_VERSION: "6.22.2"
  PYINSTALLER_HOOKS_CONTRIB_VERSION: "2026.7"
  # Pillow drives the GUI's post-capture JPEG previews. It was pinned only
  # in packaging/linux/Dockerfile, so the macOS and Windows binaries were
  # frozen from an environment with no PIL at all — and because the import
  # is soft, PyInstaller bundled nothing and emitted no warning. Those two
  # binaries shipped 1.3.3's headline feature permanently dead, and a
  # onefile binary cannot be pip-installed into afterwards.
  PILLOW_VERSION: "11.2.1"
  # 2 emulated cameras x --count 2. The smoke tests assert on this, so a
  # build that discovers cameras and saves nothing fails the job.
  SMOKE_EXPECTED_IMAGES: "4"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build via existing Dockerfile (bakes in the emulator smoke test)
        # Pass the pins through. Without --build-arg the env: block above
        # governed only the macOS and Windows jobs while Linux silently used
        # the Dockerfile's own ARG defaults — so one release tag could ship
        # four binaries built against two different pypylon versions.
        run: |
          docker build -f packaging/linux/Dockerfile \
            --build-arg PYPYLON_VERSION="${{ env.PYPYLON_VERSION }}" \
            --build-arg PYINSTALLER_VERSION="${{ env.PYINSTALLER_VERSION }}" \
            --build-arg PYINSTALLER_HOOKS_CONTRIB_VERSION="${{ env.PYINSTALLER_HOOKS_CONTRIB_VERSION }}" \
            --build-arg PILLOW_VERSION="${{ env.PILLOW_VERSION }}" \
            --build-arg SMOKE_EXPECTED_IMAGES="${{ env.SMOKE_EXPECTED_IMAGES }}" \
            -t script-grabber-build .

      - name: Extract executable from the build image
        run: |
          docker create --name sg-extract script-grabber-build
          docker cp sg-extract:/build/dist/script-grabber ./script-grabber-linux
          docker rm sg-extract

      - uses: actions/upload-artifact@v4
        with:
          name: script-grabber-linux
          path: script-grabber-linux
          if-no-files-found: error

  build-macos:
    # This repo is private, and GitHub bills macOS runner-minutes at 10x —
    # only build it on a tag push (about to cut a release) or an explicit
    # manual dispatch, not on every routine push/PR.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Explicit version-pinned labels, not "macos-latest": that label is
          # mid-migration between macOS releases as of mid-2026, and a build
          # whose dependency versions are pinned for reproducibility shouldn't
          # sit on a runner OS that can silently change under it.
          - runner: macos-15
            artifact_name: script-grabber-macos-arm64
          # pypylon ships separate arm64/x86_64 wheels, no universal2 (checked
          # directly against PyPI) — an arm64 runner can only ever produce an
          # arm64 executable, so Intel needs its own job, not a fat binary.
          - runner: macos-15-intel
            artifact_name: script-grabber-macos-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "pypylon==${{ env.PYPYLON_VERSION }}" \
            "pyinstaller==${{ env.PYINSTALLER_VERSION }}" \
            "pyinstaller-hooks-contrib==${{ env.PYINSTALLER_HOOKS_CONTRIB_VERSION }}" \
            "Pillow==${{ env.PILLOW_VERSION }}"
          # Plain "import tkinter" only catches a hard import failure, not
          # the Tcl/Tk *linkage* error that has recurred across multiple
          # GitHub-hosted macOS runner generations and only surfaces once a
          # widget/root window is actually constructed (actions/runner-images
          # #4931, #6442, #11074, #9441) — so construct one here.
          python -c "import tkinter; r = tkinter.Tk(); r.destroy()"
          # Same fail-fast reasoning as tkinter above: the previews feature
          # is a soft import, so without this the build succeeds silently
          # and the defect only shows up on an operator's machine.
          python -c "from PIL import Image, ImageTk"

      - name: Build with PyInstaller
        # Plain --onefile, no custom .spec: confirmed by direct local testing
        # (2026-08-28, Apple Silicon) that the top-level-symlink duplication
        # PyInstaller performs for a couple of pypylon's Basler libraries here
        # (libNodeMapData/libMathParser .dylib) does NOT break camera
        # discovery on macOS the way the equivalent symlinks did on Linux —
        # the PYLON_CAMEMU emulator smoke test below passed with a plain
        # onefile build. Revisit with a custom .spec only if a future
        # pypylon/PyInstaller version regresses this.
        run: pyinstaller --onefile --name ${{ matrix.artifact_name }} capture_cameras.py

      - name: Emulator smoke test (no real cameras/display on this runner)
        run: |
          PYLON_CAMEMU=2 ./dist/${{ matrix.artifact_name }} --cameras all --count 2 --format tiff --outdir smoke_test_out
          find smoke_test_out -type f -ls
          # Assert on images produced, not just on exit status and a
          # directory that resolve_outdir creates BEFORE grabbing anything.
          # `find`, not a glob: CLI capture writes into
          # <outdir>/<model>_<serial>/ subfolders, so a top-level glob
          # counts zero even on a healthy build.
          actual=$(find smoke_test_out -name '*.tiff' -type f | wc -l | tr -d ' ')
          if [ "$actual" -ne "${{ env.SMOKE_EXPECTED_IMAGES }}" ]; then
            echo "::error::smoke test captured $actual image(s), expected ${{ env.SMOKE_EXPECTED_IMAGES }}"
            exit 1
          fi
          echo "smoke test captured $actual image(s) as expected"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  build-windows:
    # Same rationale as build-macos above — Windows runner-minutes bill at
    # 2x, so this is also gated to tag pushes / manual dispatch only.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install `
            "pypylon==${{ env.PYPYLON_VERSION }}" `
            "pyinstaller==${{ env.PYINSTALLER_VERSION }}" `
            "pyinstaller-hooks-contrib==${{ env.PYINSTALLER_HOOKS_CONTRIB_VERSION }}" `
            "Pillow==${{ env.PILLOW_VERSION }}"
          python -c "import tkinter"
          python -c "from PIL import Image, ImageTk"

      - name: Build with PyInstaller
        # Plain --onefile: confirmed working on the first real CI run
        # (2026-08-28), no local Windows machine ever pre-validated this.
        # pyinstaller-hooks-contrib>=2024.0 fixed the only known pypylon+
        # PyInstaller+Windows bundling bug (basler/pypylon#514); the pinned
        # 2026.7 is well past that fix. No custom .spec needed here.
        run: pyinstaller --onefile --name script-grabber-windows capture_cameras.py

      - name: Emulator smoke test (no real cameras/display on this runner)
        run: |
          $env:PYLON_CAMEMU = "2"
          ./dist/script-grabber-windows.exe --cameras all --count 2 --format tiff --outdir smoke_test_out
          Get-ChildItem -Recurse smoke_test_out
          # Assert on images produced — see the Linux/macOS jobs for why the
          # search must be recursive.
          $actual = (Get-ChildItem -Recurse -Filter *.tiff smoke_test_out | Measure-Object).Count
          $expected = [int]"${{ env.SMOKE_EXPECTED_IMAGES }}"
          if ($actual -ne $expected) {
            Write-Error "smoke test captured $actual image(s), expected $expected"
            exit 1
          }
          Write-Host "smoke test captured $actual image(s) as expected"

      - uses: actions/upload-artifact@v4
        with:
          name: script-grabber-windows
          path: dist/script-grabber-windows.exe
          if-no-files-found: error

  release:
    # Only runs when a version tag (e.g. v1.2.0) is pushed — a normal push to
    # main just builds+smoke-tests, it doesn't publish a Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Needed for CHANGELOG.md below (body_path) — this job otherwise only
      # touches downloaded artifacts, nothing from the repo itself.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename assets with the release version (avoids same-named
          files from different releases colliding in someone's Downloads
          folder) and restore the executable bit (artifacts don't preserve it)
        run: |
          mkdir -p release
          cp artifacts/script-grabber-linux/script-grabber-linux "release/script-grabber-${{ github.ref_name }}-linux"
          cp artifacts/script-grabber-macos-arm64/script-grabber-macos-arm64 "release/script-grabber-${{ github.ref_name }}-macos-arm64"
          cp artifacts/script-grabber-macos-intel/script-grabber-macos-intel "release/script-grabber-${{ github.ref_name }}-macos-intel"
          cp artifacts/script-grabber-windows/script-grabber-windows.exe "release/script-grabber-${{ github.ref_name }}-windows.exe"
          chmod +x release/script-grabber-${{ github.ref_name }}-linux
          chmod +x release/script-grabber-${{ github.ref_name }}-macos-arm64
          chmod +x release/script-grabber-${{ github.ref_name }}-macos-intel

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          # CHANGELOG.md as the release body, not generate_release_notes —
          # auto-generated notes draw from the full commit history, which
          # for the first tag is a single squash commit whose message isn't
          # meant to be read as release notes.
          body_path: CHANGELOG.md
